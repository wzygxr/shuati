name: Build BelPhO 2003 10-2 bundle

on:
  push:
    paths:
      - 'generated/belpho_2003_10_2/build.trigger'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_URL: "https://sdmntprwestus.oaiusercontent.com/files/00000000-04b4-8230-ae32-503949dc62e9/raw?se=2026-10-17T12%3A38%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=bdf66817-881a-53b8-a8cf-cfead8a14817&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-16T20%3A36%3A51Z&ske=2026-10-17T20%3A36%3A51Z&sks=b&skv=2026-02-06&sig=cmi%2BxCD9VpvPYgbMmeLIWbvrCAM2AbyAv20XykBG070%3D"
      STEM: "2003_白俄罗斯共和国物理奥林匹克决赛_10年级第2题_小行星球形空腔反演_完整精讲"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact Markdown source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          curl --fail --location --retry 3 "$SOURCE_URL" -o "build/${STEM}.md"
          test -s "build/${STEM}.md"

      - name: Install document toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pandoc latexmk lmodern texlive-xetex texlive-lang-chinese texlive-latex-extra \
            texlive-fonts-recommended fonts-noto-cjk fonts-dejavu-core zip

      - name: Generate LaTeX source
        shell: bash
        run: |
          set -euo pipefail
          pandoc "build/${STEM}.md" \
            --standalone --toc --number-sections \
            -V documentclass=ctexart \
            -V classoption=UTF8 \
            -V geometry:margin=2.1cm \
            -V fontsize=11pt \
            -o "build/${STEM}.tex"
          test -s "build/${STEM}.tex"

      - name: Compile XeLaTeX PDF
        shell: bash
        run: |
          set -euo pipefail
          cd build
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error "${STEM}.tex"
          test -s "${STEM}.pdf"

      - name: Package and checksum
        shell: bash
        run: |
          set -euo pipefail
          cd build
          cat > README.txt <<'EOF'
          本压缩包对应 2003 年白俄罗斯共和国物理奥林匹克决赛 10 年级第 2 题。
          内容：Markdown 源、Pandoc 生成的完整 LaTeX 源、XeLaTeX PDF、来源说明与 SHA-256 校验。
          主结论：a/R=0.5030060602，r/R=0.2503298898。
          EOF
          cat > SOURCES.txt <<'EOF'
          BelPhO 年度页：https://belpho.org/problems/final/2003/
          BelPhO 独立题页：https://belpho.org/problems/final/2003/10-2/
          官方题卷：https://belpho.org/problems/final/2003problems.pdf （第3页）
          官方解答：https://belpho.org/problems/final/2003solutions.pdf （第6页）
          AAPT Past Exams：https://www.aapt.org/Common2022/pastexams.cfm
          OIbF 归档：https://olimpicos.net/oibf/
          OIbF 2000 题卷：https://olimpicos.net/files/oibf/OIbF_2000_Q1-5.pdf
          EOF
          sha256sum "${STEM}.md" "${STEM}.tex" "${STEM}.pdf" README.txt SOURCES.txt > SHA256SUMS.txt
          zip -9 "${STEM}.zip" "${STEM}.md" "${STEM}.tex" "${STEM}.pdf" README.txt SOURCES.txt SHA256SUMS.txt

      - name: Upload complete bundle
        uses: actions/upload-artifact@v4
        with:
          name: belpho-2003-10-2-complete
          path: |
            build/*.md
            build/*.tex
            build/*.pdf
            build/*.zip
            build/README.txt
            build/SOURCES.txt
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish generated files to repository
        shell: bash
        run: |
          set -euo pipefail
          DEST="generated/belpho_2003_10_2/output"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp "build/${STEM}.md" "$DEST/"
          cp "build/${STEM}.tex" "$DEST/"
          cp "build/${STEM}.pdf" "$DEST/"
          cp "build/${STEM}.zip" "$DEST/"
          cp build/README.txt build/SOURCES.txt build/SHA256SUMS.txt "$DEST/"
          printf 'run_id=%s\nsource_commit=%s\nbuilt_at=%s\nstatus=success\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$DEST/BUILD_STATUS.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "Build BelPhO 2003 10-2 document bundle [skip ci]"
          git push
